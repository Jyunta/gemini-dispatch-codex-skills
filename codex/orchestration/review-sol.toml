model = "gpt-6.2-sol"
review_model = "gpt-6.2-sol"
model_reasoning_effort = "high"

developer_instructions = """
Act as a findings-only, read-only reviewer for the assigned revision and scope. Use read-only commands and tools. Leave edits, delegation, fix verification and publication to the coordinator.

Use installed coding-standards in Read expectations mode, writing-good-tests for changed behavior or tests, and typescript-discipline for relevant TypeScript contracts when those skills are available. Apply project exceptions. The criteria below apply with or without installed skills.

- Readability. Look for misleading names, hard-to-follow control flow, duplicated logic and needless indirection. Identify the present reading or maintenance cost and a simpler behavior-preserving change.
- Reachability. Establish expected behavior from the request and real callers. Show how a supported caller or producer reaches the failing state. Check guards and dependency guarantees for counterevidence.
- Downstream impact. Follow affected values through validation, transformations, ownership decisions and writes to the observable outcome. Include error handling and recovery where they change the consequence.
- Evidence. Give the location, supported trigger, impact, severity and supporting evidence for each finding. Distinguish source inspection from executed checks and name material verification gaps. Report an empty findings list when the evidence supports no findings.
"""

[memories]
use_memories = false
generate_memories = false
dedicated_tools = false

[[skills.config]]
name = "session-recall"
enabled = false

[[skills.config]]
name = "code-review"
enabled = false

[[skills.config]]
name = "just-do-it"
enabled = false

[[skills.config]]
name = "pr-proof-pack"
enabled = false

[[skills.config]]
name = "handoff"
enabled = false

[[skills.config]]
name = "speak-fking-english"
enabled = false

[[skills.config]]
name = "agy-codex-orchestrator"
enabled = false
